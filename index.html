<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="assets/styles/main.css">
</head>
<body>
    <div id="header-placeholder"></div>
    <main>
        <div class="container">
    <div class="map-container">
    <!-- Canvas поверх фона карты -->
    <canvas id="mapCanvas"></canvas>

    <!-- Панель характеристик (теперь динамическая) -->
    <div class="drone-info" id="droneInfo">
        <div class="drone-info-header">
            <h3 id="infoTitle">Дрон</h3>
            <button class="close-btn" id="closeDroneInfo">✕</button>
        </div>
        <div class="drone-info-content">
            <div class="info-row">
                <span class="info-label">Название:</span>
                <span class="info-value" id="infoName">—</span>
            </div>
            <div class="info-row">
                <span class="info-label">Заряд:</span>
                <div class="battery-bar"><div class="battery-level" id="batteryLevel"></div></div>
                <span class="info-value" id="infoBattery">—</span>
            </div>
            <div class="info-row">
                <span class="info-label">Статус:</span>
                <span class="info-value" id="infoStatus">—</span>
            </div>
            <div class="info-row">
                <span class="info-label">Координаты:</span>
                <span class="info-value" id="infoCoords">—</span>
            </div>
        </div>
    </div>
</div>
</div>
    </main>
    <script src="assets/scripts/layout.js"></script>
    <script src="assets/scripts/map.js"></script>

</body>
</html>
