<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101820">
    <title>Авторизация | WILDFIRE OPS</title>

    <link rel="stylesheet" href="../styles/main.css">
</head>
<body class="auth-page">

    <main class="auth-main">
        <section class="auth-card auth-card-login">
            <div class="auth-brand">
                <div class="auth-brand-icon">W</div>
                <span>WILDFIRE <strong>OPS</strong></span>
            </div>

            <div class="auth-heading">
                <span class="auth-eyebrow">СИСТЕМА МОНИТОРИНГА</span>
                <h1>Авторизация</h1>
                <p>Войдите в свою учётную запись для продолжения работы.</p>
            </div>

            <form id="loginForm" class="auth-form">
                <div class="auth-field">
                    <label for="login">Логин</label>
                    <input
                        type="text"
                        id="login"
                        name="login"
                        placeholder="Введите логин"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="auth-field">
                    <label for="password">Пароль</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Введите пароль"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <p class="auth-message" id="authMessage" role="alert" aria-live="polite"></p>

                <button class="auth-button" type="submit">
                    Войти в систему
                    <span aria-hidden="true">→</span>
                </button>
            </form>

            <div class="auth-footer">
                Ещё нет аккаунта?
                <a href="registration.html">Зарегистрироваться</a>
            </div>
        </section>

        <p class="auth-copyright">WILDFIRE OPS · СИСТЕМА МОНИТОРИНГА БПЛА</p>
    </main>
    <script src="../scripts/ip.js" defer></script>
    <script src="../scripts/auth.js" defer></script>
</body>
</html>
