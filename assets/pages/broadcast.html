<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мониторинг камер | WILDFIRE OPS</title>
    <link rel="stylesheet" href="../styles/main.css">
</head>

<body>
    <div id="header-placeholder"></div>
    <main>
        <div class="view">
            <button class="view_icon active" id="window" type="button" aria-pressed="true">
                <p>Окном</p>
            </button>

            <button class="view_icon" id="TwoXTwo" type="button" aria-pressed="false">
                <p>2×2</p>
            </button>

            <button class="view_icon" id="TreeXTree" type="button" aria-pressed="false">
                <p>3×3</p>
            </button>
        </div>

        <div class="camers window" id="cameraContainer">
            <!-- Камера 1 -->
            <div class="camera" id="camera1">
                <img class="camera-stream" id="stream_camera1" src="" alt="Видеопоток камеры 1">

                <div class="top_of_the_camera">
                    <div class="left_camera_info">
                        <p id="id_camera1"></p>
                        <p id="coord_camera1" hidden></p>
                    </div>

                    <div class="right_camera_info">
                        <p id="height_camera1"></p>
                        <p id="speed_camera1"></p>
                        <p id="turn_camera1"></p>
                    </div>
                </div>

                <div class="bottom_of_the_camera">
                    <div class="left_camera_info">
                        <p id="buttary_camera1"></p>
                        <p id="ping_camera1"></p>
                    </div>

                    <div class="right_camera_info"></div>
                </div>
            </div>

            <!-- Камера 2 -->
            <div class="camera" id="camera2">
                <div class="top_of_the_camera">
                    <div class="left_camera_info">
                        <p id="id_camera2"></p>
                        <p id="coord_camera2"></p>
                    </div>
                    <div class="right_camera_info">
                        <p id="height_camera2"></p>
                        <p id="speed_camera2"></p>
                        <p id="turn_camera2"></p>
                    </div>
                </div>
                <div class="bottom_of_the_camera">
                    <div class="left_camera_info">
                        <p id="buttary_camera2"></p>
                        <p id="ping_camera2"></p>
                    </div>
                    <div class="right_camera_info"></div>
                </div>
            </div>

            <!-- Камера 3 -->
            <div class="camera" id="camera3">
                <div class="top_of_the_camera">
                    <div class="left_camera_info">
                        <p id="id_camera3"></p>
                        <p id="coord_camera3"></p>
                    </div>
                    <div class="right_camera_info">
                        <p id="height_camera3"></p>
                        <p id="speed_camera3"></p>
                        <p id="turn_camera3"></p>
                    </div>
                </div>
                <div class="bottom_of_the_camera">
                    <div class="left_camera_info">
                        <p id="buttary_camera3"></p>
                        <p id="ping_camera3"></p>
                    </div>
                    <div class="right_camera_info"></div>
                </div>
            </div>

            <!-- Камера 4 -->
            <div class="camera" id="camera4">
                <div class="top_of_the_camera">
                    <div class="left_camera_info">
                        <p id="id_camera4"></p>
                        <p id="coord_camera4"></p>
                    </div>
                    <div class="right_camera_info">
                        <p id="height_camera4"></p>
                        <p id="speed_camera4"></p>
                        <p id="turn_camera4"></p>
                    </div>
                </div>
                <div class="bottom_of_the_camera">
                    <div class="left_camera_info">
                        <p id="buttary_camera4"></p>
                        <p id="ping_camera4"></p>
                    </div>
                    <div class="right_camera_info"></div>
                </div>
            </div>
        </div>
    </main>
    <footer></footer>
    <script src="../scripts/ip.js" defer></script>
    <script src="../scripts/layout.js" defer></script>
    <script src="../scripts/telemetry.js" defer></script>
    <script src="../scripts/broadcast.js" defer></script>
</body>

</html>
