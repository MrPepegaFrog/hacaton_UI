<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101820">
    <title>Регистрация | WILDFIRE OPS</title>

    <link rel="stylesheet" href="../styles/main.css">
</head>
<body class="auth-page">

    <main class="auth-main">
        <section class="auth-card">
            <div class="auth-brand">
                <div class="auth-brand-icon">W</div>
                <span>WILDFIRE <strong>OPS</strong></span>
            </div>

            <div class="auth-heading">
                <span class="auth-eyebrow">СОЗДАНИЕ АККАУНТА</span>
                <h1>Регистрация</h1>
                <p>Создайте учётную запись для доступа к системе мониторинга.</p>
            </div>

            <form id="registerForm" class="auth-form">
                <div class="auth-field">
                    <label for="fullName">ФИО</label>
                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="Иванов Иван Иванович"
                        autocomplete="name"
                        minlength="2"
                        maxlength="100"
                        required
                    >
                </div>

                <div class="auth-field">
                    <label for="registerLogin">Логин</label>
                    <input
                        type="text"
                        id="registerLogin"
                        name="login"
                        placeholder="Придумайте логин"
                        autocomplete="username"
                        minlength="3"
                        maxlength="30"
                        required
                    >
                </div>

                <div class="auth-field">
                    <label for="registerPassword">Пароль</label>
                    <input
                        type="password"
                        id="registerPassword"
                        name="password"
                        placeholder="Минимум 8 символов"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >
                </div>

                <div class="auth-field">
                    <label for="confirmPassword">Повторите пароль</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Введите пароль ещё раз"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >
                </div>

                <p class="auth-message" id="authMessage" role="alert" aria-live="polite"></p>

                <button class="auth-button" type="submit">
                    Зарегистрироваться
                    <span aria-hidden="true">→</span>
                </button>
            </form>

            <div class="auth-footer">
                Уже есть аккаунт?
                <a href="login.html">Войти</a>
            </div>
        </section>

        <p class="auth-copyright">WILDFIRE OPS · СИСТЕМА МОНИТОРИНГА БПЛА</p>
    </main>
    <script src="../scripts/ip.js" defer></script>
    <script src="../scripts/auth.js" defer></script>
</body>
</html>
